    <style>
      :root { --tpi-bg-1:#070a12; --tpi-bg-2:#0b1020; --tpi-accent:#3b82f6; --tpi-text:#e5e7eb; --tpi-dim:#94a3b8; }
      
      #tpi-preloader { 
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: radial-gradient(ellipse 140% 100% at 50% -20%, rgba(59,130,246,.12), transparent 50%),
                    radial-gradient(ellipse 100% 80% at 50% 120%, rgba(139,92,246,.08), transparent 50%),
                    linear-gradient(180deg, #0a0e1a 0%, #070a12 50%, #050711 100%);
        overflow:hidden; transition: opacity .6s cubic-bezier(0.4, 0, 0.2, 1), visibility .6s;
      }
      #tpi-preloader.tpi-preloader--fade { opacity: 0; visibility: hidden; }
      
      .tpi-particles { position:absolute; inset:0; overflow:hidden; }
      .tpi-particle { position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; 
        animation: tpiFloat 8s ease-in-out infinite; opacity:0; box-shadow: 0 0 4px rgba(255,255,255,.3); }
      .tpi-particle:nth-child(1) { left:12%; top:18%; animation-delay:0s; animation-duration:6.5s; }
      .tpi-particle:nth-child(2) { left:88%; top:12%; animation-delay:1s; animation-duration:8.5s; }
      .tpi-particle:nth-child(3) { left:42%; top:75%; animation-delay:2s; animation-duration:7.5s; }
      .tpi-particle:nth-child(4) { left:68%; top:68%; animation-delay:1.5s; animation-duration:7s; }
      .tpi-particle:nth-child(5) { left:22%; top:65%; animation-delay:2.8s; animation-duration:8s; }
      .tpi-particle:nth-child(6) { left:78%; top:38%; animation-delay:0.5s; animation-duration:9s; }
      .tpi-particle:nth-child(7) { left:35%; top:25%; animation-delay:1.8s; animation-duration:7.8s; }
      .tpi-particle:nth-child(8) { left:58%; top:42%; animation-delay:3.2s; animation-duration:6.8s; }
      .tpi-particle:nth-child(9) { left:8%; top:55%; animation-delay:0.8s; animation-duration:8.2s; }
      .tpi-particle:nth-child(10) { left:92%; top:48%; animation-delay:2.5s; animation-duration:7.2s; }
      .tpi-particle:nth-child(11) { left:48%; top:15%; animation-delay:1.3s; animation-duration:8.8s; }
      .tpi-particle:nth-child(12) { left:28%; top:88%; animation-delay:3.5s; animation-duration:6.5s; }
      .tpi-particle:nth-child(13) { left:15%; top:45%; animation-delay:2.2s; animation-duration:7.3s; }
      .tpi-particle:nth-child(14) { left:72%; top:22%; animation-delay:0.7s; animation-duration:8.7s; }
      .tpi-particle:nth-child(15) { left:38%; top:82%; animation-delay:3.1s; animation-duration:6.9s; }
      .tpi-particle:nth-child(16) { left:82%; top:58%; animation-delay:1.4s; animation-duration:7.6s; }
      .tpi-particle:nth-child(17) { left:25%; top:32%; animation-delay:2.6s; animation-duration:8.3s; }
      .tpi-particle:nth-child(18) { left:62%; top:8%; animation-delay:0.9s; animation-duration:7.1s; }
      .tpi-particle:nth-child(19) { left:5%; top:72%; animation-delay:3.3s; animation-duration:6.7s; }
      .tpi-particle:nth-child(20) { left:95%; top:85%; animation-delay:1.1s; animation-duration:8.9s; }
      .tpi-particle:nth-child(21) { left:52%; top:52%; animation-delay:2.9s; animation-duration:7.4s; }
      .tpi-particle:nth-child(22) { left:18%; top:92%; animation-delay:0.3s; animation-duration:8.1s; }
      
      @keyframes tpiFloat { 
        0%, 100% { transform: translate(0, 0) scale(0); opacity:0; }
        15% { opacity:.4; }
        50% { transform: translate(var(--tx, 20px), var(--ty, -30px)) scale(1); opacity:.6; }
        85% { opacity:.3; }
      }
      
      .tpi-grid { 
        position:absolute; inset:0; 
        background-image: 
          linear-gradient(rgba(59,130,246,.015) 1px, transparent 1px),
          linear-gradient(90deg, rgba(59,130,246,.015) 1px, transparent 1px);
        background-size: 80px 80px;
        opacity:.4;
        mask-image: radial-gradient(ellipse 70% 50% at 50% 50%, black 30%, transparent 65%);
      }
      
      .tpi-shell { 
        position:relative; text-align:center; padding:0; max-width:680px; width:92%;
      }
      
      .tpi-logo-container {
        position:relative; margin:0 auto 48px; width:130px; height:130px;
        perspective: 1000px;
      }
      
      .tpi-orbit { 
        position:absolute; inset:-16px; border-radius:50%; 
        border:1px solid rgba(59,130,246,.12);
        animation: tpiOrbitRotate 24s linear infinite;
      }
      .tpi-orbit:nth-child(2) { 
        inset:-28px; border-color:rgba(139,92,246,.1); 
        animation-duration:30s; animation-direction:reverse; 
      }
      .tpi-orbit-dot {
        position:absolute; top:50%; left:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
        background:var(--tpi-accent); border-radius:50%; box-shadow:0 0 10px rgba(59,130,246,.7);
        transform-origin: 0 0;
      }
      @keyframes tpiOrbitRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      
      .tpi-logo-wrap { 
        position:relative; width:100%; height:100%; display:grid; place-items:center;
        animation: tpiLogoFloat 3.5s ease-in-out infinite;
      }
      @keyframes tpiLogoFloat { 
        0%, 100% { transform: translateY(0); } 
        50% { transform: translateY(-6px); } 
      }
      
      .tpi-logo-glow {
        position:absolute; inset:-25px; border-radius:50%;
        background: radial-gradient(circle, rgba(59,130,246,.2), transparent 65%);
        filter:blur(25px); opacity:.5;
        animation: tpiGlowPulse 2.5s ease-in-out infinite;
      }
      @keyframes tpiGlowPulse { 0%, 100% { opacity:.4; transform:scale(.96); } 50% { opacity:.6; transform:scale(1.04); } }
      
      .tpi-logo-inner {
        position:relative; width:105px; height:105px; border-radius:50%;
        background: linear-gradient(135deg, rgba(15,23,42,.85), rgba(7,10,18,.9));
        border:1px solid rgba(148,163,184,.12);
        box-shadow: 0 6px 24px rgba(0,0,0,.4), 
                    inset 0 1px 0 rgba(255,255,255,.04),
                    0 0 0 1px rgba(59,130,246,.08);
        display:grid; place-items:center;
      }
      
      .tpi-logo-inner::before {
        content:''; position:absolute; inset:14px; border-radius:50%;
        background: conic-gradient(from 180deg, rgba(59,130,246,.12), transparent 45%, rgba(139,92,246,.1) 65%, transparent);
        opacity:.35; animation: tpiRotate 10s linear infinite;
      }
      @keyframes tpiRotate { to { transform:rotate(360deg); } }
      
      .tpi-logo { position:relative; z-index:2; }
      .tpi-logo img { width:52px; height:52px; object-fit:contain; filter:drop-shadow(0 2px 8px rgba(59,130,246,.3)); }
      
      .tpi-content { position:relative; }
      
      .tpi-title { 
        font-size: clamp(24px, 3.2vw, 34px); font-weight:700; 
        letter-spacing:.12em; color: #fff; text-transform: uppercase; white-space: nowrap; overflow: visible;
        background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,.9) 50%, #fff 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text; margin-bottom:10px;
      }
      
      .tpi-sub { 
        color: var(--tpi-dim); font-size: 12px; letter-spacing:.5em; 
        text-transform: uppercase; font-weight:500; margin-bottom:36px;
        opacity:.75;
      }
      
      .tpi-progress-container { 
        position:relative; width:260px; height:2.5px; margin:0 auto;
        background: linear-gradient(90deg, rgba(59,130,246,.06), rgba(139,92,246,.06));
        border-radius:3px; overflow:hidden;
      }
      
      .tpi-progress-bar {
        position:absolute; left:0; top:0; height:100%; width:0;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
        background-size: 200% 100%;
        border-radius:3px;
        box-shadow: 0 0 16px rgba(59,130,246,.4), 0 0 32px rgba(59,130,246,.25);
        animation: tpiProgress 2.2s ease-in-out infinite, tpiShimmer 1.8s linear infinite;
      }
      @keyframes tpiProgress { 
        0% { width:0; } 
        50% { width:80%; } 
        100% { width:100%; } 
      }
      @keyframes tpiShimmer { to { background-position: 200% 0; } }
      
      .tpi-tagline {
        margin-top:28px; font-size:10.5px; letter-spacing:.18em;
        color: rgba(148,163,184,.45); text-transform:uppercase; font-weight:500;
      }
    </style>
  </head>

  <body>
    <div id="tpi-preloader" role="status" aria-label="Loading">
      <div class="tpi-grid"></div>
      <div class="tpi-particles">
        <div class="tpi-particle" style="--tx:25px;--ty:-35px;"></div>

        <div class="tpi-particle" style="--tx:-18px;--ty:-32px;"></div>

          <div class="tpi-logo-wrap">

            <div class="tpi-logo-inner">
              <div class="tpi-logo">
                <img alt="TPI" src="https://turningpointinstitute.in/wp-content/uploads/2022/07/cropped-cropped-cropped-Blue-Dark-Minimalist-Initial-T-Letter-Logo-512-x-512-px-1.png" />
              </div>
            </div>
          </div>
        </div>
        <div class="tpi-content">
          <div class="tpi-title">TURNING POINT</div>
          <div class="tpi-sub">INSTITUTE</div>
          <div class="tpi-progress-container">
            <div class="tpi-progress-bar"></div>
          </div>
          <div class="tpi-tagline">The One To Turn To</div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
